<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>雲端記帳本 - 月度</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="style.css"> <!-- 共用樣式 -->
</head>
<body>
<div class="app-container" id="main-container">
  <!-- 動態載入導航與 Auth -->
</div>
<script src="app.js"></script>
<script>
  document.getElementById('main-container').innerHTML = `
    ${renderAuthBar()}
    ${renderNavTabs('monthly')}
    <!-- 月度頁面專屬 HTML 內容 -->
    <div class="dashboard">
      <div class="dashboard-header">
        <span class="label">當月總結餘 (MOP)</span>
        <div class="controls-group">
          <input type="month" id="filter-month" class="picker-dashboard">
          <button type="button" class="btn-export" onclick="exportMonthCSV()">📥 CSV</button>
        </div>
      </div>
      <div class="total-balance" id="month-net-balance">MOP$ 0.00</div>
    </div>
    <!-- 其他月度表單與列表結構... -->
  `;
  initAuthListener(() => {
    // 初始化月度頁面渲染
  });
</script>
</body>
</html>
