<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳本</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>💰 記帳本</h1>
      <div class="header-actions">
        <button id="btn-rates" class="btn" title="匯率設定">💱 匯率</button>
        <button id="btn-add" class="btn primary">＋ 新增紀錄</button>
      </div>
    </header>

    <!-- 月份導航 -->
    <div class="month-nav">
      <button id="btn-prev-month" class="btn-icon">‹</button>
      <h2 id="current-month-label">2026年8月</h2>
      <button id="btn-next-month" class="btn-icon">›</button>
    </div>

    <!-- 本月摘要 -->
    <div class="summary-cards">
      <div class="card income">
        <div class="label">本月收入 (MOP)</div>
        <div class="value" id="summary-income">MOP 0</div>
      </div>
      <div class="card expense">
        <div class="label">本月支出 (MOP)</div>
        <div class="value" id="summary-expense">MOP 0</div>
      </div>
      <div class="card balance">
        <div class="label">結餘 (MOP)</div>
        <div class="value" id="summary-balance">MOP 0</div>
      </div>
    </div>

    <!-- 圖表區 -->
    <section class="chart-section">
      <h3>本月支出分類 (MOP)</h3>
      <div class="chart-container">
        <canvas id="categoryChart"></canvas>
      </div>
      <div id="no-chart-data" class="empty-hint" style="display:none;">本月尚無支出資料</div>
    </section>

    <!-- 紀錄列表 -->
    <section class="records-section">
      <h3>本月紀錄</h3>
      <div id="records-list"></div>
      <div id="no-records" class="empty-hint">本月尚無紀錄，點擊上方按鈕新增</div>
    </section>
  </div>

  <!-- 新增 / 編輯 彈出視窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">新增紀錄</h3>
        <button id="btn-close-modal" class="btn-icon">×</button>
      </div>
      <form id="record-form">
        <input type="hidden" id="edit-id">

        <div class="form-row">
          <label>類型</label>
          <div class="type-toggle">
            <button type="button" class="type-btn active" data-type="expense">支出</button>
            <button type="button" class="type-btn" data-type="income">收入</button>
          </div>
        </div>

        <div class="form-row">
          <label for="amount">金額</label>
          <div class="amount-row">
            <select id="currency" required>
              <option value="MOP">MOP 澳門幣</option>
              <option value="HKD">HKD 港幣</option>
              <option value="CNY">CNY 人民幣</option>
            </select>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
        </div>

        <div class="form-row">
          <label for="date">日期</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-row">
          <label for="category">分類</label>
          <select id="category" required>
            <option value="餐飲">🍔 餐飲</option>
            <option value="交通">🚗 交通</option>
            <option value="購物">🛍️ 購物</option>
            <option value="娛樂">🎮 娛樂</option>
            <option value="居住">🏠 居住</option>
            <option value="母嬰">👶 母嬰</option>
            <option value="保險費">🛡️ 保險費</option>
            <option value="學貸">🎓 學貸</option>
            <option value="生活費">💵 生活費</option>
            <option value="薪資">💼 薪資</option>
            <option value="電話費">📞 電話費</option>
            <option value="電費">⚡ 電費</option>
            <option value="淘寶">🛒 淘寶</option>
            <option value="上網費">🌐 上網費</option>
            <option value="醫療">🏥 醫療</option>
            <option value="其他">🏷️ 其他</option>
          </select>
        </div>

        <div class="form-row hidden" id="custom-category-row">
          <label for="custom-category">自訂分類</label>
          <input type="text" id="custom-category" placeholder="輸入自訂分類名稱">
        </div>

        <div class="form-row">
          <label for="payment">支付方式</label>
          <select id="payment" required>
            <option value="現金">現金</option>
            <option value="信用卡">信用卡</option>
            <option value="金融卡">金融卡</option>
            <option value="電子支付">電子支付 (Line Pay / 街口等)</option>
            <option value="轉帳">轉帳</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-row">
          <label for="note">備註</label>
          <input type="text" id="note" placeholder="選填">
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn">取消</button>
          <button type="submit" class="btn primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 匯率設定彈出視窗 -->
  <div id="rates-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>匯率設定</h3>
        <button id="btn-close-rates" class="btn-icon">×</button>
      </div>
      <form id="rates-form">
        <p class="rates-hint">設定其他貨幣兌 MOP 的匯率。摘要與圖表會依此換算成澳門幣。</p>
        <div class="form-row">
          <label for="rate-hkd">1 HKD = ? MOP</label>
          <input type="number" id="rate-hkd" step="0.0001" min="0.0001" required>
        </div>
        <div class="form-row">
          <label for="rate-cny">1 CNY = ? MOP</label>
          <input type="number" id="rate-cny" step="0.0001" min="0.0001" required>
        </div>
        <div class="form-row">
          <label>1 MOP = 1 MOP</label>
          <input type="text" value="1（基準貨幣，不可改）" disabled>
        </div>
        <div class="form-actions">
          <button type="button" id="btn-reset-rates" class="btn">還原預設</button>
          <button type="submit" class="btn primary">儲存匯率</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
